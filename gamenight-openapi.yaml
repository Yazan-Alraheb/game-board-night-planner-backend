                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accepted friendship required or unauthorized conversation access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/conversations/{id}/messages:
    get:
      tags:
      - Messages
      summary: Get messages in conversation
      operationId: get_api_conversations_id_messages
      description: >-
        Requires conversation membership and current game-night eligibility for
        linked conversations. Private conversations require current accepted
        friendship; unfriending returns 403 without deleting history. Ordinary
        groups retain membership-based access. Returns the latest matching messages ordered by
        created_at descending and id descending. The before timestamp is
        exclusive. Timestamp-only continuation excludes all equal-time messages;
        if a limited page ends within a timestamp tie, remaining messages at
        that timestamp are skipped by the next before request.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: before
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Exclusive timezone-aware RFC 3339 timestamp, normalized to UTC; timezone-naive values return 422
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                required:
                - messages
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accepted friendship required or unauthorized conversation access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    post:
      tags:
      - Messages
      summary: Send message to conversation
      operationId: post_api_conversations_id_messages
      description: >-
        Sender is derived from the authenticated user and must be a conversation
        participant. Linked conversations also require current host or accepted
        attendee eligibility instead of friendship. Private conversations require
        current accepted friendship; unfriending returns 403 and preserves history.
        Ordinary groups retain membership-based access. Content must contain a non-whitespace character,
        is limited to 2000 characters, and preserves its original formatting.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
                required:
                - message
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accepted friendship required or unauthorized conversation access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
