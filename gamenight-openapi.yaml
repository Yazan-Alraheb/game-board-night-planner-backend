openapi: 3.2.1
info:
  title: GameNight API
  version: 1.0.0
  description: OpenAPI design for the GameNight board and card game night planner. JWT Bearer authentication is
    required unless an operation indicates otherwise. Game-night recommendations use confirmed attendees and games
    with owned collection status.
servers:
- url: http://localhost:8000
  description: Local FastAPI development server
tags:
- name: Authentication
- name: Users / Preferences
- name: Games
- name: Game Collection
- name: Friends
- name: Game Nights
- name: Recommendations
- name: Messages
paths:
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      operationId: post_api_auth_register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Conflict with existing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Log in with email and password
      operationId: post_api_auth_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/auth/me:
    get:
      tags:
      - Authentication
      summary: Get current authenticated user
      operationId: get_api_auth_me
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required:
                - user
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/{id}:
    get:
      tags:
      - Users / Preferences
      summary: Get user profile
      operationId: get_api_users_id
      description: Returns public profile fields. For security, the response excludes password_hash and does not
        disclose email unless authorized.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: &id001
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
                required:
                - user
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Users / Preferences
      summary: Update own profile
      operationId: put_api_users_id
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required:
                - user
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/users/{id}/preferences:
    get:
      tags:
      - Users / Preferences
      summary: Get user preferences
      operationId: get_api_users_id_preferences
      description: A user may read their own saved preferences; other users cannot access them directly.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preference'
                required:
                - preferences
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Users / Preferences
      summary: Update user preferences
      operationId: put_api_users_id_preferences
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    $ref: '#/components/schemas/Preference'
                required:
                - preferences
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/games:
    get:
      tags:
      - Games
      summary: Browse, search and filter games
      operationId: get_api_games
      parameters:
      - name: search
        in: query
        required: false
        schema: &id002
          type: string
      - name: players
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: category
        in: query
        required: false
        schema: *id002
      - name: difficulty
        in: query
        required: false
        schema:
          type: string
          enum:
          - Easy
          - Medium
          - Hard
      - name: playtime
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Maximum playtime in minutes
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameList'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/games/{id}:
    get:
      tags:
      - Games
      summary: Get one game
      operationId: get_api_games_id
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    $ref: '#/components/schemas/Game'
                required:
                - game
                additionalProperties: false
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/users/{id}/collection:
    get:
      tags:
      - Game Collection
      summary: Get owned games or wishlist
      operationId: get_api_users_id_collection
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CollectionStatus'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionEntry'
                required:
                - games
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Game Collection
      summary: Add game to owned collection or wishlist
      operationId: post_api_users_id_collection
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionAdd'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionChangeResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with existing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/users/{id}/collection/{game_id}:
    put:
      tags:
      - Game Collection
      summary: Change owned/wishlist status
      operationId: put_api_users_id_collection_game_id
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: game_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionChangeResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    delete:
      tags:
      - Game Collection
      summary: Remove game from collection or wishlist
      operationId: delete_api_users_id_collection_game_id
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: game_id
        in: path
        required: true
        schema: *id001
      responses:
        '204':
          description: No content
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/friends:
    get:
      tags:
      - Friends
      summary: Get current user friends
      operationId: get_api_friends
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicUser'
                required:
                - friends
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users:
    get:
      tags:
      - Friends
      summary: Search users to add as friends
      operationId: get_api_users
      security:
      - BearerAuth: []
      parameters:
      - name: search
        in: query
        required: false
        schema: *id002
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicUser'
                required:
                - users
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/friend-requests:
    post:
      tags:
      - Friends
      summary: Send a friend request
      operationId: post_api_friend_requests
      description: >-
        The authenticated user is the sender. A pending request or accepted
        friendship blocks another request between the two users in either
        direction. After a recipient declines a request, the same sender cannot
        resend to that recipient for seven days by default, configurable through
        FRIEND_REQUEST_COOLDOWN_DAYS (a positive integer). The cooldown is measured
        from the latest known decline time, not the request's creation time,
        using timezone-aware UTC values. Resending is allowed exactly at expiry.
        The reverse direction and different sender/recipient pairs are unaffected
        by that decline. Historical declines without a known resolution time do
        not impose a cooldown. Repeated resolution attempts do not restart it.
        Resolution timestamps remain internal and are not response fields.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  friend_request:
                    $ref: '#/components/schemas/FriendRequest'
                required:
                - friend_request
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An active friendship/request exists or the directed decline cooldown has not expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    get:
      tags:
      - Friends
      summary: List incoming or outgoing friend requests
      operationId: get_api_friend_requests
      security:
      - BearerAuth: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - incoming
          - outgoing
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/FriendRequest'
                required:
                - requests
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/friend-requests/{id}:
    put:
      tags:
      - Friends
      summary: Accept or decline friend request
      operationId: put_api_friend_requests_id
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  friend_request:
                    $ref: '#/components/schemas/FriendRequest'
                required:
                - friend_request
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with existing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    delete:
      tags:
      - Friends
      summary: Cancel a pending request sent by the current user
      operationId: delete_api_friend_requests_id
      description: >-
        Cancel a pending friend request sent by the authenticated user. Only the original sender can cancel a request. Successful cancellation returns 204 with no response body. Accepted or declined requests cannot be canceled.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      responses:
        '204':
          description: Pending request canceled; no response body
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only the original sender can cancel this request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Friend request not found or already canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Only pending requests can be canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/friends/{id}:
    delete:
      tags:
      - Friends
      summary: Remove a friend
      operationId: delete_api_friends_id
      description: Path id is the friend’s User.id.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      responses:
        '204':
          description: No content
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/game-nights:
    get:
      tags:
      - Game Nights
      summary: Get current user game nights
      operationId: get_api_game_nights
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_nights:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameNight'
                required:
                - game_nights
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Game Nights
      summary: Create a game night and optionally invite friends or select games
      operationId: post_api_game_nights
      description: Host ID is taken from the authenticated user. Host is automatically added to members with accepted
        status. Optional invitee_ids create pending invitations.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameNightCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_night:
                    $ref: '#/components/schemas/GameNight'
                required:
                - game_night
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/game-nights/{id}:
    get:
      tags:
      - Game Nights
      summary: Get game-night details
      operationId: get_api_game_nights_id
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_night:
                    $ref: '#/components/schemas/GameNight'
                required:
                - game_night
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Game Nights
      summary: Edit game-night details
      operationId: put_api_game_nights_id
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameNightUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_night:
                    $ref: '#/components/schemas/GameNight'
                required:
                - game_night
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
