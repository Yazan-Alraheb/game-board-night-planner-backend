  /api/recommendations:
    post:
      tags:
      - Recommendations
      summary: Calculate ranked Best Matches for own collection or a selected game night
      operationId: post_api_recommendations
      description: >-
        Calculates recommendations dynamically without saving results. Personal mode
        uses only the authenticated user's owned games and saved preferences.
        Game-night mode requires the host or an accepted attendee; no friendship or
        conversation membership is required. Candidates come from owned collections
        of the host and accepted attendees, deduplicated by game ID. Wishlist games
        and pending, declined, removed, or unrelated users' collections are excluded.
        Owners contains only eligible owners, ordered by user ID. Past events are allowed.
        Player count and maximum playtime are hard filters. Personal saved dislikes
        exclude a game unless the matching category is explicitly requested; other
        unrequested disliked categories still exclude it. Group dislikes reduce scores.
        Categories and experience are soft preferences. Scores use weights 30/20/20/15/15
        for requested categories, experience, saved favorites, difficulty, and playtime.
        Missing preferences are neutral and participants have equal weight. In personal
        mode, explicit categories replace saved favorites and override matching dislikes,
        and explicit experience replaces saved difficulty. In game_night mode, the
        questionnaire adds criteria for the event only: categories feed only the
        30-point requested-category component and experience only the 20-point
        experience component. Every participant's saved favorites, difficulty, playtime,
        and dislikes are always scored independently and are never replaced or disabled
        by the questionnaire. Maximum playtime overrides saved playtime as an
        eligibility limit; saved playtime remains a soft scoring preference.
        Group dislikes subtract up to 20 points proportionally, including for requested
        categories. Scores are clamped to 0-100, ordered by unrounded score descending
        then game ID ascending, and rounded to two decimals in responses. Reasons
        describe the group's saved fit only in aggregate and do not identify attendee
        preferences. No qualifying games returns 200 with an empty recommendations array.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'
                required:
                - recommendations
                additionalProperties: false
        '400':
          description: Missing conditional player_count or game_night_id, or game_night_id supplied in personal mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Existing game night requires host or accepted attendee access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/conversations:
    get:
      tags:
      - Messages
      summary: Get private and group conversations
      operationId: get_api_conversations
      description: >-
        Lists only conversations where the authenticated user has an existing
        conversation membership. For game-night-linked conversations the user
        must also remain the host or an accepted attendee. Results are ordered
        newest-first by creation time and then conversation ID. Participants
        expose public profile fields only.
        Private conversations are omitted while their users are not accepted
        friends. Conversations and messages remain stored; re-friending restores
        visibility. Ordinary group membership is unaffected by friendship changes.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                required:
                - conversations
                additionalProperties: false
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Messages
      summary: Create private or group conversation
      operationId: post_api_conversations
      description: >-
        participant_ids accepts up to 50 IDs. The authenticated creator is added
        automatically, so a group conversation may contain up to 51 members if
        the creator is omitted from participant_ids. Private conversations
        require exactly two distinct users including the creator; groups require
        at least two. Supplying the creator once does not duplicate membership.
        Private conversations require an accepted friendship in either request
        direction. Ordinary groups require accepted friendship between the creator
        and every other participant, but not between other members. Pending and
        declined requests do not qualify; failure returns 403. Only a game-night host may create a linked
        group conversation, and selected participants must be the host or
        accepted attendees, without an additional friendship requirement. New attendees are not added automatically. Duplicate
        private pairs, including reversed order, and duplicate game-night
        conversations return 409.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
                required:
                - conversation
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accepted friendship required or unauthorized conversation access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Private conversation or game-night conversation already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/conversations/{id}:
    get:
      tags:
      - Messages
      summary: Get conversation and participants
      operationId: get_api_conversations_id
      description: >-
        Requires an existing conversation membership. For linked conversations,
        the user must additionally remain the game-night host or an accepted
        attendee. Existing conversations return 403 to unauthorized users;
        nonexistent conversations return 404. Private conversations additionally
        require current accepted friendship; after unfriending both users receive
        403 for details and messages. History and membership are preserved, and
        re-friending restores access to the same conversation. Ordinary group
        access remains membership-based after friendship changes.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
                required:
