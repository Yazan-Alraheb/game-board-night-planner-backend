      - id
      - name
      - email
      - created_at
      additionalProperties: false
    PublicUser:
      type: object
      properties:
        id: *id001
        name: *id002
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
      - name
      - email
      - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password: *id002
      required:
      - email
      - password
      additionalProperties: false
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token: *id002
        token_type:
          type: string
          enum:
          - bearer
      required:
      - user
      - access_token
      - token_type
      additionalProperties: false
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
      required:
      - name
      additionalProperties: false
    Preference:
      type: object
      properties:
        id: *id001
        user_id: *id001
        favorite_categories:
          type: array
          items: *id002
        disliked_categories:
          type: array
          items: *id002
        preferred_difficulty:
          allOf:
          - type: string
            enum:
            - Easy
            - Medium
            - Hard
          nullable: true
        preferred_playtime:
          type: integer
          minimum: 1
          nullable: true
      required:
      - id
      - user_id
      - favorite_categories
      - disliked_categories
      additionalProperties: false
    PreferenceUpdate:
      type: object
      properties:
        favorite_categories:
          type: array
          items: *id002
        disliked_categories:
          type: array
          items: *id002
        preferred_difficulty:
          type: string
          enum:
          - Easy
          - Medium
          - Hard
          nullable: true
        preferred_playtime:
          type: integer
          minimum: 1
          nullable: true
      required:
      - favorite_categories
      - disliked_categories
      additionalProperties: false
    Game:
      type: object
      properties:
        id: *id001
        name: *id002
        description:
          type: string
          nullable: true
        minimum_players:
          type: integer
          minimum: 1
        maximum_players:
          type: integer
          minimum: 1
        playtime:
          type: integer
          minimum: 1
          description: Minutes
        difficulty:
          type: string
          enum:
          - Easy
          - Medium
          - Hard
        categories:
          type: array
          items: *id002
        image_url:
          type: string
          format: uri
          nullable: true
        rating:
          type: number
          minimum: 0
          maximum: 5
          nullable: true
        review_count:
          type: integer
          minimum: 0
          nullable: true
        instructions:
          type: string
          nullable: true
      required:
      - id
      - name
      - minimum_players
      - maximum_players
      - playtime
      - difficulty
      additionalProperties: false
    GameList:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
      required:
      - games
      - total
      - page
      additionalProperties: false
    CollectionStatus:
      type: string
      enum:
      - owned
      - wishlist
    CollectionAdd:
      type: object
      properties:
        game_id: *id001
        status:
          $ref: '#/components/schemas/CollectionStatus'
      required:
      - game_id
      - status
      additionalProperties: false
    CollectionUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CollectionStatus'
      required:
      - status
      additionalProperties: false
    CollectionEntry:
      type: object
