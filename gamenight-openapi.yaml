    RecommendationMode:
      type: string
      enum:
      - personal
      - game_night
    RecommendationRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/RecommendationMode'
        game_night_id:
          type: integer
          minimum: 1
          maximum: 2147483647
        player_count:
          type: integer
          minimum: 1
          maximum: 2147483647
        max_playtime:
          type: integer
          minimum: 1
          maximum: 2147483647
        categories:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: At most 50 items of at most 100 characters each, counted before trimming.
            Trimmed and case-insensitive; blank strings are rejected; duplicates are collapsed.
        experience_level:
          type: string
          enum:
          - Beginner
          - Intermediate
          - Experienced
      required:
      - mode
      - max_playtime
      additionalProperties: false
      description: >-
        mode and max_playtime are universally required (422 if missing).
        game_night_id is required in game_night mode and forbidden in personal mode
        (400 for these mode/ID combinations). player_count is required in personal
        mode (400 if omitted); in game_night mode it defaults to the number of unique
        eligible participants, including the host and accepted attendees. An explicit
        player_count overrides that default. Optional fields must be omitted rather
        than sent as null. Integers are strict and at most 2147483647; booleans and
        numeric strings are rejected.
        Unknown fields, invalid types/values, blank categories, and invalid enums return 422.
    Recommendation:
      type: object
      properties:
        game:
          $ref: '#/components/schemas/Game'
        score:
          type: number
          minimum: 0
          maximum: 100
        reason: *id002
        owners:
          type: array
          items:
            $ref: '#/components/schemas/PublicUser'
      required:
      - game
      - score
      - reason
      - owners
      additionalProperties: false
    ConversationType:
      type: string
      enum:
      - private
      - group
    Conversation:
      type: object
      properties:
        id: *id001
        type:
          $ref: '#/components/schemas/ConversationType'
        game_night_id:
          type: integer
          nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/PublicUser'
        created_at: *id003
      required:
      - id
      - type
      - participants
      - created_at
      additionalProperties: false
    ConversationCreate:
      type: object
      properties:
        participant_ids:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
          minItems: 1
          maxItems: 50
          uniqueItems: true
        type:
          $ref: '#/components/schemas/ConversationType'
        game_night_id:
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - participant_ids
      - type
      additionalProperties: false
      description: >-
        participant_ids accepts up to 50 IDs. The authenticated creator is added
        automatically, so a group conversation may contain up to 51 members if
        the creator is omitted from participant_ids. Private conversations
        require exactly two distinct users including the creator; groups require
        at least two. participant_ids must be unique; the creator may be supplied
        once. Omit game_night_id when not linking an event. It is only applicable
        to groups. Only the host may create an event-linked conversation, and
        every selected participant must be the host or an accepted attendee.
        Private pairs and game-night conversations are unique; duplicates return
        409. Invalid participant composition returns 400; missing users or events
        return 404; unauthorized event creation or participants return 403.
        Ordinary private and group conversations require accepted friendship
        between the creator and every other participant; game-night conversations do not.
    Message:
      type: object
      properties:
        id: *id001
        conversation_id: *id001
        user_id: *id001
        content: *id002
        created_at: *id003
      required:
      - id
      - conversation_id
      - user_id
      - content
      - created_at
      additionalProperties: false
    MessageCreate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: .*\S.*
          description: Must contain a non-whitespace character; NUL characters (U+0000) are rejected; preserves formatting; maximum 2000 characters
      required:
      - content
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        detail: *id002
      required:
      - detail
      additionalProperties: false
    ValidationErrorResponse:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                  - *id002
                  - *id001
              msg: *id002
              type: *id002
            required:
            - loc
            - msg
            - type
      required:
      - detail
      additionalProperties: false
