services:
  db:
    image: postgres:17-alpine
    container_name: gamenight-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: gamenight
      POSTGRES_PASSWORD: gamenight_dev
      POSTGRES_DB: gamenight

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamenight -d gamenight"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
